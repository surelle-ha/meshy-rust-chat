name: '🦀 Rust Build and Release'

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Windows target for cross-compilation
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW for Windows cross-compile
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Linux binary
        run: cargo build --release

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/meshy-rust-chat
          asset_name: meshy-rust-chat-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/x86_64-pc-windows-gnu/release/meshy-rust-chat.exe
          asset_name: meshy-rust-chat-windows.exe
          asset_content_type: application/octet-stream
