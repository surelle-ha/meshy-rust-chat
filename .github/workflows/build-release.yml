name: '🦀 Rust Build and Release'

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v4

      # 2. Set up Rust
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # 3. Cache cargo registry and build
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      # 4. Build Linux binary
      - name: Build Linux binary
        run: cargo build --release

      # 5. Build Windows binary using cross-compilation
      - name: Install Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW for Windows build
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mingw-w64

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      # 6. Create release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Upload release assets
      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/meshy-rust-chat
          asset_name: meshy-rust-chat-linux
          asset_content_type: application/octet-stream

      - name: Upload Windows binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/x86_64-pc-windows-gnu/release/meshy-rust-chat.exe
          asset_name: meshy-rust-chat-windows.exe
          asset_content_type: application/octet-stream
