name: '🦀 Rust Build and Release'

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build
        run: cargo build --release

      # Create release once on Ubuntu runner
      - name: Create GitHub Release
        if: matrix.os == 'ubuntu-latest'
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a personal access token if GITHUB_TOKEN fails
          # GITHUB_TOKEN: ${{ secrets.PAT }}

      # Upload Linux binary
      - name: Upload Linux binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/meshy-rust-chat
          asset_name: meshy-rust-chat-linux
          asset_content_type: application/octet-stream

      # Upload Windows binary
      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/meshy-rust-chat.exe
          asset_name: meshy-rust-chat-windows.exe
          asset_content_type: application/octet-stream
