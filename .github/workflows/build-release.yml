name: '🦀 Rust Build and Release'

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build
        run: |
          cargo build --release
        shell: bash

      - name: Create GitHub Release (Linux only)
        if: matrix.os == 'ubuntu-latest'
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ matrix.os == 'ubuntu-latest' && 'target/release/meshy-rust-chat' || 'target/release/meshy-rust-chat.exe' }}
          asset_name: ${{ matrix.os == 'ubuntu-latest' && 'meshy-rust-chat-linux' || 'meshy-rust-chat-windows.exe' }}
          asset_content_type: application/octet-stream
